services:
  postgres:
    image: postgres:15-alpine
    container_name: employee_tracking_db
    environment:
      POSTGRES_USER: timetrack
      POSTGRES_PASSWORD: timetrack123
      POSTGRES_DB: employee_tracking
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetrack -d employee_tracking"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: employee_tracking_api
    environment:
      DATABASE_URL: postgresql://timetrack:timetrack123@postgres:5432/employee_tracking
      SECRET_KEY: super-secret-key-please-change-in-production-32chars
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:8000"]'
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    command: >
      sh -c "python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: employee_tracking_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
